<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="./assents/styles/global.css" />
  </head>
  <body>
    <main>
        <h1>Crie seu Avatar</h1>
        <div class="container">
            <div class="avatar-container">
                <div class="avatar">
                    <canvas id="avatarCanvas"></canvas>
                </div>
                <button class="save-btn">Salvar Personagem</button>
            </div>
            
            <div class="controles">
                <div class="lista">
                    <ul>
                        <li data-category="nariz" class="active">Nariz</li>
                        <li data-category="olhos">Olhos</li>
                        <li data-category="bocas">Boca</li>
                        <li data-category="cabelos">Cabelo</li>
                        <li data-category="franjas">Franja</li>
                        <li data-category="orelhas">Orelhas</li>
                    </ul>
                </div>
                
                <div class="opcoes-container">
                    <div class="opcao active" id="nariz-options">
                        <div class="narizes">
                            <button class="opcao-btn" data-nariz="0">Nariz 1</button>
                            <button class="opcao-btn" data-nariz="1">Nariz 2</button>
                            <button class="opcao-btn" data-nariz="2">Nariz 3</button>
                            <button class="opcao-btn" data-nariz="3">Nariz 4</button>
                        </div>
                    </div>
                    
                    <div class="opcao" id="olhos-options">
                        <div class="olhos">
                            <button class="opcao-btn" data-olhos="0">Olhos 1</button>
                            <button class="opcao-btn" data-olhos="1">Olhos 2</button>
                            <button class="opcao-btn" data-olhos="2">Olhos 3</button>
                            <button class="opcao-btn" data-olhos="3">Olhos 4</button>
                        </div>
                    </div>
                    
                    <div class="opcao" id="bocas-options">
                        <div class="bocas">
                            <button class="opcao-btn" data-bocas="0">Boca 1</button>
                            <button class="opcao-btn" data-bocas="1">Boca 2</button>
                            <button class="opcao-btn" data-bocas="2">Boca 3</button>
                            <button class="opcao-btn" data-bocas="3">Boca 4</button>
                        </div>
                    </div>
                    
                    <div class="opcao" id="cabelos-options">
                        <div class="cabelos">
                            <button class="opcao-btn" data-cabelos="0">Cabelo 1</button>
                            <button class="opcao-btn" data-cabelos="1">Cabelo 2</button>
                            <button class="opcao-btn" data-cabelos="2">Cabelo 3</button>
                            <button class="opcao-btn" data-cabelos="3">Cabelo 4</button>
                        </div>
                    </div>
                    
                    <div class="opcao" id="franjas-options">
                        <div class="franjas">
                            <button class="opcao-btn" data-franjas="0">Franja 1</button>
                            <button class="opcao-btn" data-franjas="1">Franja 2</button>
                            <button class="opcao-btn" data-franjas="2">Franja 3</button>
                            <button class="opcao-btn" data-franjas="3">Franja 4</button>
                        </div>
                    </div>
                    
                    <div class="opcao" id="orelhas-options">
                        <div class="orelhas">
                            <button class="opcao-btn" data-orelhas="0">Orelha 1</button>
                            <button class="opcao-btn" data-orelhas="1">Orelha 2</button>
                            <button class="opcao-btn" data-orelhas="2">Orelha 3</button>
                            <button class="opcao-btn" data-orelhas="3">Orelha 4</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>


    <script src="./assents/scripts/lista.js"></script>
    <script src="./assents/scripts/"></script>
  </body>
</html>
