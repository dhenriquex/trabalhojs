<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Criador de Avatar</title>
    <link rel="stylesheet" href="./assets/styles/global.css" />
  </head>
  <body>
    <main>
      <h1>Crie seu Avatar</h1>
      <div class="container">
        <div class="avatar-container">
          <div class="avatar">
            <canvas id="avatarCanvas" width="800" height="804"></canvas>
          </div>
          <button class="save-btn" onclick="salvarAvatar()">
            Salvar Avatar
          </button>
          <button class="save-btn" onclick="salvarAvatarComo()">
            Salvar Avatar Como...
          </button>
        </div>

        <div class="controles">
          <div class="lista">
            <ul>
              <li data-category="base">Base</li>
              <li data-category="nariz" class="active">Nariz</li>
              <li data-category="olhos">Olhos</li>
              <li data-category="boca">Boca</li>
              <li data-category="cabelo">Chapéu</li>
              <li data-category="roupa">Roupa</li>
            </ul>
            <div id="color-picker-group-base" class="color-picker-group" style="margin-top: 10px; display: flex; flex-direction: column; align-items: center; gap: 6px;">
              <label style="font-size: 13px;">Cor do traço da Base:</label>
              <input type="color" id="strokeColor-base" value="#000000" />
            </div>
            <div id="color-picker-group-nariz" class="color-picker-group" style="margin-top: 10px; display: none; flex-direction: column; align-items: center; gap: 6px;">
              <label style="font-size: 13px;">Cor do traço do Nariz:</label>
              <input type="color" id="strokeColor-nariz" value="#000000" />
            </div>
            <div id="color-picker-group-olhos" class="color-picker-group" style="margin-top: 10px; display: none; flex-direction: column; align-items: center; gap: 6px;">
              <label style="font-size: 13px;">Cor do traço dos Olhos:</label>
              <input type="color" id="strokeColor-olhos" value="#000000" />
            </div>
            <div id="color-picker-group-boca" class="color-picker-group" style="margin-top: 10px; display: none; flex-direction: column; align-items: center; gap: 6px;">
              <label style="font-size: 13px;">Cor do traço da Boca:</label>
              <input type="color" id="strokeColor-boca" value="#000000" />
            </div>
            <div id="color-picker-group-cabelo" class="color-picker-group" style="margin-top: 10px; display: none; flex-direction: column; align-items: center; gap: 6px;">
              <label style="font-size: 13px;">Cor do traço do Chapéu:</label>
              <input type="color" id="strokeColor-cabelo" value="#000000" />
            </div>
            <div id="color-picker-group-roupa" class="color-picker-group" style="margin-top: 10px; display: none; flex-direction: column; align-items: center; gap: 6px;">
              <label style="font-size: 13px;">Cor do traço da Roupa:</label>
              <input type="color" id="strokeColor-roupa" value="#000000" />
            </div>
          </div>

          <div class="opcoes-container">
            <div class="opcao" id="base-options">
              <div class="opcoes-grid"></div>
            </div>
            <div class="opcao active" id="nariz-options">
              <div class="opcoes-grid"></div>
            </div>
            <div class="opcao" id="olhos-options">
              <div class="opcoes-grid"></div>
            </div>
            <div class="opcao" id="boca-options">
              <div class="opcoes-grid"></div>
            </div>
            <div class="opcao" id="cabelo-options">
              <div class="opcoes-grid"></div>
            </div>
            <div class="opcao" id="orelha-options">
              <div class="opcoes-grid"></div>
            </div>
            <div class="opcao" id="roupa-options">
              <div class="opcoes-grid"></div>
            </div>
          </div>
        </div>
      </div>
    </main>
    <script src="./assets/scripts/lista.js"></script>
    <script src="./assets/scripts/script.js"></script>
    <script src="./assets/scripts/canvas.js"></script>
  </body>
</html>
